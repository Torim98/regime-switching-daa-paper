# ============================================================================
# Central Configuration: Regime-Switching DAA Pipeline
# ============================================================================
# Single source of truth for all pipeline parameters.
# Changes here propagate to all services via config_loader.py.
# ============================================================================

# --- Data Ingestion (Data Service) ---
data:
  tickers:
    - "^GSPC"       # S&P 500
    - "VUSTX"       # Long-Term US Treasury Bonds (Vanguard)
    - "^VIX"        # CBOE Volatility Index
    - "^IRX"        # 3-Month Treasury Bill Rate (Cash proxy)
    - "^TNX"        # 10-Year Treasury Note Yield
  start_date: "1990-01-02"
  # end_date:
  #   - null (or leave the field empty) -> dynamic = today (rolling mode)
  #   - "YYYY-MM-DD"                     -> fixed cutoff (thesis-freeze mode, inclusive)
  end_date:

# --- Feature Engineering (Data Service) ---
features:
  sma_window: 200
  volatility_window: 20
  momentum_window: 10
  model_features:
    - "Returns"
    - "Vol_20"
    - "Distance_SMA"
    - "Momentum"
    - "VIX"
    - "Yield_Spread"

# --- Portfolio Allocation ---
portfolio:
  weight_equity: 0.6    # S&P 500
  weight_bonds: 0.4     # VUSTX

# --- Model Hyperparameters (Model Service) ---
models:
  msm:
    k_regimes: 2
    switching_variance: true
    threshold: 0.7    # basis for the other models; bear signal when prob >= threshold; thesis initial value 0.5
    train_test_split: &msm_train_test_split 0.8  # 0.8, only used when walk_forward.enabled: false
  hmm:
    features:
      - "Returns"
      - "VIX"
      - "Yield_Spread"
    n_components: 2
    covariance_type: "tied"     # thesis initial value "full"
    n_iter: 1000
    random_state: 42
    threshold: 0.35             # bear signal when prob >= threshold; thesis initial value 0.5
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
  hmm_uni:
    features:
      - "Returns"               # same input space as MSM (comparison axis)
    n_components: 2
    covariance_type: "full"     # univariate: full/diag/tied/spherical are equivalent
    n_iter: 1000
    random_state: 42
    threshold: 0.35             # bear signal when prob >= threshold; thesis initial value 0.5
  lstm:
    window_size: 120            # thesis initial value 60
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
    units_l1: 32                # thesis initial value 32
    units_l2: 64                # thesis initial value 64
    return_sequences: true
    epochs: 40                  # thesis initial value 30
    batch_size: 32
    learning_rate: 0.0001053    # thesis initial value 0.001
    dropout: 0.4                # thesis initial value 0.2
    dense: 1
    activation: "sigmoid"
    optimizer: "adam"
    metrics: "accuracy"
    validation_split: 0.1
    verbose: 1
    threshold: 0.3              # bear signal when prob >= threshold; thesis initial value 0.5
  transformer:
    # --- Data ---
    window_size: 40              # same sequence length as LSTM; thesis initial value 60
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
    # --- Architecture ---
    d_model: 32                  # embedding dimension (Transformer internal dimension); thesis initial value 64
    n_heads: 4                   # number of attention heads (d_model must be divisible by n_heads!); thesis initial value 4
    n_layers: 3                  # number of Transformer encoder layers; thesis initial value 2
    dim_feedforward: 128         # dimension of the feed-forward network in the encoder; thesis initial value 128
    dropout: 0.1                 # dropout rate (regularization); thesis initial value 0.1
    # --- Training ---
    epochs: 40                   # thesis initial value 50
    batch_size: 32
    learning_rate: 0.00003282    # thesis initial value 0.0001
    validation_split: 0.1
    verbose: 1
    # --- Signal ---
    threshold: 0.55              # bear signal when prob >= threshold; thesis initial value 0.5
     # --- Class Balancing ---
    pos_weight_auto: true        # automatic weighting for bear class

# --- Walk-Forward Validation (Model Service) ---
walk_forward:
  enabled: true                   # false = fallback to the old 80/20 split
  mode: "rolling"                  # "rolling" or "expanding"
  train_window_years: 10           # length of the train window (rolling only)
  test_window_months: 12           # length per OOS fold
  step_months: 12                  # step size (= test_window for non-overlapping folds)
  min_train_years: 10              # minimum training data in the first fold (expanding)
  retrain_dl: true                 # retrain LSTM/Transformer in every fold
  retrain_msm_hmm: true            # retrain MSM/HMM in every fold
  cache_enabled: true
  n_jobs: -1                        # -1 = all CPUs, 1 = sequential (debug), int = fixed count
  dl_warm_start: true
  dl_warm_start_epochs: 10

# --- Backtesting (Backtest Service) ---
## --- Hyperparameter Optimization (Optuna) ---
optimization:
  enabled: false                    # Set to true to run Optuna; set to false if the found params are already in the config and only the final WF run remains.
  metric: "sharpe"                  # optimization target: "sharpe", "sortino", "calmar"
  models:
    - "MSM"
    - "HMM"
    - "HMM_Uni"
    - "LSTM"
    - "Transformer"
  # Trials per model. Econometric models are cheap (50 trials),
  # DL models more expensive (30 trials). Same for every_nth_fold: DL subsamples more.
  n_trials_per_model:
    MSM: 50
    HMM: 50
    HMM_Uni: 50
    LSTM: 30
    Transformer: 30
  every_nth_fold_per_model:
    MSM: 2
    HMM: 2
    HMM_Uni: 2
    LSTM: 2
    Transformer: 2
  storage: "sqlite:///models/optuna_studies.db"   # optional: persist the Optuna DB

backtesting:
  transaction_cost_bps: 10    # Basis points (10 = 0.1%)
  signal_shift: 1             # T+1 shift for look-ahead bias prevention
  sorr:
    scenarios:
      Standard:
        initial_capital: 500000.00
        annual_withdrawal_rate: 0.06     # 2500€/month ÷ 500000€ × 12 = 0.06
        liquidity_fee: 0.001
      Aggressive:
        initial_capital: 500000.00
        annual_withdrawal_rate: 0.096    # 4000€/month ÷ 500000€ × 12 = 0.096
        liquidity_fee: 0.001
      Low_Capital:
        initial_capital: 300000.00
        annual_withdrawal_rate: 0.08     # 2000€/month ÷ 300000€ × 12 = 0.08
        liquidity_fee: 0.001

# --- Evaluation / MCS (Backtest Service) ---
evaluation:
  mcs:
    n_paths: 10000
    block_length: 20
    random_seed: 42
    sim_years: 10
    trading_days_per_year: 252
  # --- Issue #13: Extended Evaluation (Sec. 4.1-4.4) ---
  extended:
    nber_source: "fred_csv"         # "fred_csv" | "local"
    f1_models: ["MSM", "HMM", "HMM_Uni", "LSTM", "Transformer"]
    whipsaw_min_phase_days: 5
    threshold_grid:
      MSM:         [0.25, 0.30, 0.35, 0.40, 0.50]
      HMM:         [0.40, 0.45, 0.50, 0.55, 0.60]
      HMM_Uni:     [0.40, 0.45, 0.50, 0.55, 0.60]
      LSTM:        [0.20, 0.30, 0.40, 0.50]
      Transformer: [0.30, 0.40, 0.45, 0.50, 0.60]
    fee_grid_bps: [0, 5, 10, 20, 30, 50, 75, 100, 150, 200]
    withdrawal_rates: [0.035, 0.04, 0.05]
    ttr_min_dd: -0.05               # only drawdowns < −5 %
    alpha: 0.05                     # significance level (Sec. 1.5)
    hypothesis_scenario: "Aggressive"   # MCS scenario for H1/H2 tests
    crisis_windows:
      GFC:   ["2007-10-01", "2009-03-31"]
      COVID: ["2020-02-01", "2020-04-30"]
      "2022": ["2022-01-01", "2022-10-31"]

## --- Plotting ---
plotting:
  colors:
    MSM: "tab:blue"
    HMM: "tab:purple"
    HMM_Uni: "tab:pink"
    LSTM: "tab:green"
    Transformer: "darkorange"
    Buy_Hold: "gray"

