# ============================================================================
# Central Configuration: Regime-Switching DAA Pipeline
# ============================================================================
# Single source of truth for all pipeline parameters.
# Changes here propagate to all services via config_loader.py.
# ============================================================================

# --- Data Ingestion (Data Service) ---
data:
  tickers:
    - "^GSPC"       # S&P 500
    - "VUSTX"       # Long-Term US Treasury Bonds (Vanguard)
    - "^VIX"        # CBOE Volatility Index
    - "^IRX"        # 3-Month Treasury Bill Rate (Cash proxy)
    - "^TNX"        # 10-Year Treasury Note Yield
  start_date: "1990-01-02"
  # end_date:
  #   - null (or leave the field empty) -> dynamic = today (rolling mode)
  #   - "YYYY-MM-DD"                     -> fixed cutoff (thesis-freeze mode, inclusive)
  end_date: 2026-07-31

# --- Feature Engineering (Data Service) ---
features:
  sma_window: 200
  volatility_window: 20
  momentum_window: 10
  model_features:
    - "Returns"
    - "Vol_20"
    - "Distance_SMA"
    - "Momentum"
    - "VIX"
    - "Yield_Spread"

# --- Portfolio Allocation ---
portfolio:
  weight_equity: 0.6    # S&P 500
  weight_bonds: 0.4     # VUSTX

# --- Model Hyperparameters (Model Service) ---
models:
  msm:
    k_regimes: 2
    switching_variance: true
    threshold: 0.175  # basis for the other models; bear signal when prob >= threshold; thesis initial value 0.5
    train_test_split: &msm_train_test_split 0.8  # 0.8, only used when walk_forward.enabled: false
  hmm:
    features:
      - "Returns"
      - "VIX"
      - "Yield_Spread"
    n_components: 2
    covariance_type: "diag"     # thesis initial value "full"
    n_iter: 1000
    random_state: 42
    n_init: 10                  # multi-start EM: fit n_init times, keep highest train log-likelihood (tames EM init sensitivity; 1 = single fit)
    threshold: 0.975            # bear signal when prob >= threshold; thesis initial value 0.5
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
  hmm_uni:
    features:
      - "Returns"               # same input space as MSM (comparison axis)
    n_components: 2
    covariance_type: "full"     # univariate state-specific covariance; full/diag/spherical are equivalent, tied is not
    n_iter: 1000
    random_state: 42
    n_init: 10                  # multi-start EM (see hmm.n_init); univariate is already near-stable, kept consistent
    threshold: 0.175            # bear signal when prob >= threshold; thesis initial value 0.5
  lstm:
    window_size: 140            # thesis initial value 60
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
    units_l1: 16                # thesis initial value 32
    units_l2: 32                # thesis initial value 64
    return_sequences: true
    epochs: 30                  # thesis initial value 30
    batch_size: 128
    learning_rate: 0.00002008   # thesis initial value 0.001
    dropout: 0.5                # thesis initial value 0.2
    dense: 1
    activation: "sigmoid"
    optimizer: "adam"
    metrics: "accuracy"
    validation_split: 0.1
    verbose: 1
    threshold: 0.35              # bear signal when prob >= threshold; thesis initial value 0.5
  transformer:
    # --- Data ---
    window_size: 230             # same sequence length as LSTM; thesis initial value 60
    train_test_split: *msm_train_test_split  # 0.8, only used when walk_forward.enabled: false
    # --- Architecture ---
    d_model: 16                  # embedding dimension (Transformer internal dimension); thesis initial value 64
    n_heads: 2                   # number of attention heads (d_model must be divisible by n_heads!); thesis initial value 4
    n_layers: 2                  # number of Transformer encoder layers; thesis initial value 2
    dim_feedforward: 256         # dimension of the feed-forward network in the encoder; thesis initial value 128
    dropout: 0.25                # dropout rate (regularization); thesis initial value 0.1
    # --- Training ---
    epochs: 50                   # thesis initial value 50
    batch_size: 64
    learning_rate: 0.003203      # thesis initial value 0.0001
    validation_split: 0.1
    verbose: 1
    # --- Signal ---
    threshold: 0.5               # bear signal when prob >= threshold; thesis initial value 0.5
     # --- Class Balancing ---
    pos_weight_auto: true        # automatic weighting for bear class

# --- Walk-Forward Validation (Model Service) ---
walk_forward:
  enabled: true                   # false = fallback to the old 80/20 split
  mode: "rolling"                  # "rolling" or "expanding"
  train_window_years: 10           # length of the train window (rolling only)
  test_window_months: 12           # length per OOS fold
  step_months: 12                  # step size (= test_window for non-overlapping folds)
  min_train_years: 10              # minimum training data in the first fold (expanding)
  retrain_dl: true                 # retrain LSTM/Transformer in every fold
  retrain_msm_hmm: true            # retrain MSM/HMM in every fold
  cache_enabled: true
  n_jobs: -1                        # -1 = all CPUs, 1 = sequential (debug), int = fixed count
  dl_warm_start: true
  dl_warm_start_epochs: 10
  dl_ensemble_size: 5               # seed-averaged prob ensemble for LSTM/Transformer per fold (tames retraining variance ~1/sqrt(N); 1 = single seed-pinned model). Cost: N x DL training.
  dl_ensemble_seed_base: 0          # base global seed; members use seed_base+0..N-1 (reproducible)

# --- Backtesting (Backtest Service) ---
## --- Hyperparameter Optimization (Optuna) --- (Issue #5: paper-grade HPO)
optimization:
  enabled: false                    # Set to true to run Optuna; set to false if the found params are already in the config and only the final WF run remains.
  # Objective metric on the POOLED OOS return series across all HPO folds
  # (not the fold-wise median). Path-dependent tail metrics are driven by the
  # rare crisis folds, which aligns the objective with the SORR/tail-risk goal.
  # Options: "sharpe" | "sortino" | "calmar" | "martin" | "ulcer" | "max_drawdown".
  # "martin" = CAGR / Ulcer index (depth AND duration of drawdowns; SORR-related).
  metric: "martin"
  models:
    - "MSM"
    - "HMM"
    - "HMM_Uni"
    - "LSTM"
    - "Transformer"
  # Econometric models are searched EXHAUSTIVELY via GridSampler (the grid size
  # overrides n_trials at runtime). DL models use a multivariate TPESampler.
  grid_models: ["MSM", "HMM", "HMM_Uni"]
  # TPE trial budgets for the DL models (min budget; a convergence review after
  # each 100-trial block decides on continuation, see Issue #5
  n_trials_per_model:
    MSM: 36            # ignored: GridSampler uses the exact grid size (36)
    HMM: 108           # ignored: grid size (3 x 36)
    HMM_Uni: 36        # ignored: grid size (36)
    LSTM: 300
    Transformer: 400
  # Inner CV now uses ALL folds (was 2 = every second fold, which starved the
  # search of crisis folds).
  every_nth_fold_per_model:
    MSM: 1
    HMM: 1
    HMM_Uni: 1
    LSTM: 1
    Transformer: 1
  sampler:
    seed: 42                        # reproducibility (Issue #5 acceptance criterion)
    multivariate: true             # model interactions (e.g. window x lr x dropout)
    group: true
    n_startup_trials:              # random exploration before TPE kicks in
      LSTM: 50
      Transformer: 60
  pruning:
    # Disabled for the DL headline run: the MedianPruner compares intermediate
    # values over chronologically ordered folds, so a config that protects in
    # the rare crisis folds (exactly what we want) looks mediocre in the early
    # bullish folds and would be pruned. 100% complete trials also yield
    # unbiased fANOVA importances and contour plots. Set true only under a
    # compute budget cap; then n_warmup_steps should cover the early crises.
    enabled: false
    n_startup_trials: 5
    n_warmup_steps: 10
  # Selection vs. evaluation (Issue #5): optimize only on folds whose OOS
  # test window ends on or before this date (development period: Dotcom + GFC).
  # The final walk-forward run uses ALL folds, so the holdout (COVID, 2022)
  # stays selection-free. Set to null/"" to tune on all folds.
  tune_until: "2016-12-31"
  # Epochs are no longer a tuned hyperparameter: a large ceiling combined with
  # the trainers' early stopping governs the effective epoch count.
  dl_max_epochs: 150
  # Versioned study name so a resume never mixes trials from the old (Sharpe,
  # 30-trial) search into the new distributions. Old DB kept as archive.
  # v3 prevents resuming v2 trials, whose DL labels were computed with future
  # fold data and whose econometric objectives used n_init=1 plus fold resets.
  study_suffix: "v3_martin_causal_stateful"
  # Revised search spaces (Issue #5): edge-of-range optima from the thesis run
  # (LSTM window=120/dropout=0.4/threshold=0.3, MSM threshold=0.7, d_model=32)
  # are all un-bounded; the (d_model, n_heads) constraint is encoded as valid
  # pairs instead of being pruned away.
  search_spaces:
    MSM:
      threshold:       {type: float, low: 0.10, high: 0.975, step: 0.025}  # upper bound raised 0.90 -> 0.975 (HMM optimum sat at 0.875, one step below the old bound)
    HMM:
      covariance_type: {type: categorical, choices: ["full", "diag", "tied"]}
      threshold:       {type: float, low: 0.10, high: 0.975, step: 0.025}  # upper bound raised 0.90 -> 0.975 (HMM optimum sat at 0.875, one step below the old bound)
    HMM_Uni:
      threshold:       {type: float, low: 0.10, high: 0.975, step: 0.025}  # upper bound raised 0.90 -> 0.975 (HMM optimum sat at 0.875, one step below the old bound)
    LSTM:
      window_size:     {type: int, low: 20, high: 250, step: 10}
      units_l1:        {type: categorical, choices: [16, 32, 64, 128]}
      units_l2:        {type: categorical, choices: [32, 64, 128, 256]}
      batch_size:      {type: categorical, choices: [32, 64, 128]}
      learning_rate:   {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
      dropout:         {type: float, low: 0.0, high: 0.6, step: 0.05}
      threshold:       {type: float, low: 0.10, high: 0.90, step: 0.05}
    Transformer:
      window_size:     {type: int, low: 20, high: 250, step: 10}
      # Valid (d_model, n_heads) pairs only -> guarantees d_model % n_heads == 0.
      dmodel_nheads:   {type: categorical, choices: ["16-2", "32-2", "32-4", "64-4", "64-8", "128-4", "128-8"]}
      n_layers:        {type: int, low: 1, high: 4, step: 1}
      dim_feedforward: {type: categorical, choices: [32, 64, 128, 256]}
      batch_size:      {type: categorical, choices: [32, 64, 128]}
      learning_rate:   {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
      dropout:         {type: float, low: 0.0, high: 0.5, step: 0.05}
      threshold:       {type: float, low: 0.10, high: 0.90, step: 0.05}
  storage: "sqlite:///models/optuna_studies.db"   # optional: persist the Optuna DB

backtesting:
  transaction_cost_bps: 10    # Basis points (10 = 0.1%)
  signal_shift: 1             # T+1 shift for look-ahead bias prevention
  # --- Signal Smoothing / Hysteresis (Issue #10 ablation) ---
  # Post-processes the RAW walk-forward regime signals to reduce churning.
  # Applied after the walk-forward cache, so toggling does NOT trigger a
  # retraining: set `enabled: false` to fully restore the un-smoothed baseline.
  # Both mechanisms are causal (no look-ahead) and may be combined.
  signal_smoothing:
    enabled: false            # master toggle; false = pass raw signals through unchanged
    min_holding_days: 5       # dwell-time lock: switch immediately, then hold the new regime for >= N obs
                              # before switching back (crisis entry is never delayed); 0/1 = off
    confidence_buffer: 0.1    # Schmitt-trigger half-width on the probability around each model's
                              # threshold; ON at threshold+buffer, OFF at threshold-buffer (0.0 = off).
                              # 0.1 = largest round value keeping both trigger bounds strictly inside
                              # (0,1) for all tuned thresholds (HMM 0.875+0.1, LSTM 0.15-0.1); chosen
                              # ex ante, NOT selected on OOS results (holdout stays selection-free)
  sorr:
    # Rates recalibrated for the 30-year decumulation horizon (previously
    # 0.06 / 0.096 / 0.08 on a 10-year horizon, where ruin required an
    # overstretched withdrawal rate). 4% anchors to the SWR literature
    # (Bengen 1994, Trinity study, 30-year standard horizon); 6% is the
    # stress rate; Low_Capital combines a reduced base with the mid rate.
    scenarios:
      Standard:
        initial_capital: 500000.00
        annual_withdrawal_rate: 0.04     # ~1666.67€/month × 12 ÷ 500000€ = 0.04
        liquidity_fee: 0.001
      Aggressive:
        initial_capital: 500000.00
        annual_withdrawal_rate: 0.06     # 2500€/month × 12 ÷ 500000€ = 0.06
        liquidity_fee: 0.001
      Low_Capital:
        initial_capital: 300000.00
        annual_withdrawal_rate: 0.05     # 1250€/month × 12 ÷ 300000€ = 0.05
        liquidity_fee: 0.001

# --- Evaluation / MCS (Backtest Service) ---
evaluation:
  mcs:
    n_paths: 10000
    block_length: 20
    bootstrap_method: "stationary"     # "block" (fixed-length) | "stationary" (Politis & Romano 1994)
    random_seed: 42
    sim_years: 30                      # decumulation horizon; 30y = SWR-literature standard (previously 10)
    trading_days_per_year: 252
    # Full capital paths are persisted only for this many paths per
    # (scenario, strategy) cell (plots/dashboard). Inference (depletion CI,
    # H1/H2) always uses all n_paths via terminal capitals + path-wise MaxDD,
    # which are computed in-stream. Keeps 06_mcs_data.parquet and RAM bounded
    # (full persistence at 30y × 10k paths would be ~13 GB on disk alone).
    n_plot_paths: 1000
  # --- Issue #13: Extended Evaluation ---
  extended:
    nber_source: "fred_csv"         # "fred_csv" | "local"
    f1_models: ["MSM", "HMM", "HMM_Uni", "LSTM", "Transformer"]
    whipsaw_min_phase_days: 5
    threshold_grid:
      MSM:         [0.25, 0.30, 0.35, 0.40, 0.50]
      HMM:         [0.40, 0.45, 0.50, 0.55, 0.60]
      HMM_Uni:     [0.40, 0.45, 0.50, 0.55, 0.60]
      LSTM:        [0.20, 0.30, 0.40, 0.50]
      Transformer: [0.30, 0.40, 0.45, 0.50, 0.60]
    fee_grid_bps: [0, 5, 10, 20, 30, 50, 75, 100, 150, 200]
    withdrawal_rates: [0.035, 0.04, 0.05]
    ttr_min_dd: -0.05               # only drawdowns < −5 %
    alpha: 0.05                     # significance level
    hypothesis_scenario: "Aggressive"   # MCS scenario for H1/H2 tests
    # Single source of truth for the historical crisis windows.
    # Consumed by BOTH the crisis-performance table (calculate_crisis_performance)
    # and the switch-timing analysis (switch_timing_vs_peak). Keys are the row
    # labels used in the generated assets. Dot-Com and GFC lie in the HPO
    # development period; COVID and the 2022 rate shock lie in the selection-free
    # holdout (tune_until 2016-12-31).
    crisis_windows:
      "Dot-Com (2000-03 to 2002-10)":        ["2000-03-01", "2002-10-31"]
      "GFC (2007-10 to 2009-03)":            ["2007-10-01", "2009-03-31"]
      "EU Debt Crisis (2011-07 to 2011-11)": ["2011-07-01", "2011-11-30"]
      "COVID Crash (2020-02 to 2020-03)":    ["2020-02-01", "2020-03-31"]
      "Rate Hikes (2022-01 to 2022-10)":     ["2022-01-01", "2022-10-31"]

