services:
  data-service:
    build:
      context: .
      dockerfile: services/data_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Berlin

  model-service:
    build:
      context: .
      dockerfile: services/model_service/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./assets:/app/assets
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Berlin
      # Unbuffered stdout so print() progress (fold fallbacks, warnings) shows
      # live in the Docker logs during long GPU jobs instead of block-buffering.
      - PYTHONUNBUFFERED=1
      # TF grabs all GPU memory by default; growth mode leaves room for torch
      # (LSTM/TF and Transformer/torch share the GPU in one process).
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # GPU passthrough
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - data-service
    command: uvicorn services.model_service.main:app --host 0.0.0.0 --port 8002 --timeout-keep-alive 28800

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest_service/Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Berlin
    depends_on:
      - model-service

  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard_service/Dockerfile
    # Dev-only binding: reachable from localhost only, not exposed to the network
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
      - ./logs:/app/logs
      - ./models:/app/models  # read-only access to Optuna DB for /api/optuna/best-params
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Berlin
      - DATA_SERVICE_URL=http://data-service:8001
      - MODEL_SERVICE_URL=http://model-service:8002
      - BACKTEST_SERVICE_URL=http://backtest-service:8003
    depends_on:
      - data-service
      - model-service
      - backtest-service